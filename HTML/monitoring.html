<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring</title>
    <link rel="stylesheet" href="styles.css">
    <script src="mqtt.min.js"></script>
    <script src="script.js" defer></script>
    <style>
        .alert-modal {
            display: none;  /* Par défaut, l'alerte est cachée */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);  /* Fond semi-transparent */
            justify-content: center;
            align-items: center;
            z-index: 1000;  /* S'assurer que l'alerte est au-dessus des autres éléments */
        }

        .alert-box {
            background-color: red;
            color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 500px;
            text-align: center;
        }

        .alert-box h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .alert-box p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .alert-box a {
            color: yellow;
            text-decoration: underline;
            font-size: 1.2em;
        }

        /* Style du bouton de fermeture */
        .close-btn {
            background-color: yellow;
            color: black;
            font-size: 1.2em;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .close-btn:hover {
            background-color: #ffcc00;
        }
    </style>
</head>
<body onload="sendSignalSeuils()">
    <header>
        <nav>
            <ul>
                <li><a href="gestion.html">Gestion</a></li>
                <li><a href="logs.html">Logs</a></li>
                <li><a href="reservation.html">Réservations</a></li>
                <li><a href="monitoring.html">Monitoring</a></li>
            </ul>
        </nav>
        <button class="logout-button" onclick="window.location.href='login.html'">Déconnexion</button>
    </header>
    <main>
        <h1>Monitoring de l'Open-Space</h1>
        <section>
            <h2>Paramètres environnementaux</h2>
            <div id="monitoringData">
                <p>Température: <span id="temperature">N/A</span> °C</p>
                <p>Éclairement: <span id="light">N/A</span> Lux</p>
                <p>CO2: <span id="co2">N/A</span> ppm</p>
                <p>Nombre de personnes: <span id="peopleCount">N/A</span></p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Open-Space Management</p>
    </footer>
    </div>
</body>
</html>
